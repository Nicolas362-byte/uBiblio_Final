spring.application.name=uBiblio
spring.main.web-application-type=none
spring.main.banner-mode=off

# Database dibuat otomatis jika belum ada (createDatabaseIfNotExist=true).
# Sesuaikan username/password jika MySQL kamu memakai password.
spring.datasource.url=jdbc:mysql://localhost:3306/ubiblio_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tabel 'buku' dibuat/diperbarui otomatis dari kelas Buku
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
